name: Qualidade · análise do SonarCloud (Terraform, scripts e workflows)

# Etapa 8 (spec §11.2): análise estática do Terraform, dos scripts e dos workflows em todo PR e na main, com o
# Quality Gate como check. Sem cobertura: a infraestrutura é validada por plan, smoke e pelo ambiente local.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        # Histórico completo: o SonarCloud usa o blame para separar código novo do antigo.
        with: { fetch-depth: 0 }
      - name: Analisar no SonarCloud e esperar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
