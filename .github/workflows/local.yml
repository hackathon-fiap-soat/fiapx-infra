name: Ambiente local · docker compose (MySQL, LocalStack, Mailpit)

# Sobe o ambiente local (docker compose) e roda o script de verificação, para garantir que todo
# integrante consegue subir MySQL + LocalStack + Mailpit com os recursos esperados.
on:
  pull_request:
    paths: ["local/**", "sql/**", ".github/workflows/local.yml"]
  push:
    branches: [main]
    paths: ["local/**", "sql/**", ".github/workflows/local.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambiente-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Scripts do ambiente (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Verificar os scripts de init e de verificação (shellcheck)
        run: shellcheck -x local/init/localstack/*.sh local/init/mysql/*.sh local/scripts/*.sh

  compose:
    name: Subir e verificar o compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: local
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Validar o docker-compose.yml
        run: docker compose config --quiet
      - name: Subir o ambiente (MySQL, LocalStack e Mailpit)
        run: docker compose up -d --wait
      - name: Conferir os recursos criados no ambiente (verificar.sh)
        run: ./scripts/verificar.sh
      - name: Mostrar os logs do ambiente (só em falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar o ambiente e apagar os volumes
        if: always()
        run: docker compose down -v
