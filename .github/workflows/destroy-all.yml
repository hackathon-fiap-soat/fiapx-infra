name: Destroy-all · derruba o ambiente prod inteiro
run-name: ${{ format('Destroy-all · derrubada manual por {0}', github.actor) }}

# Derruba o ambiente na ordem inversa (ADR-018): video-api (kubectl delete, para o TargetGroupBinding
# soltar o ALB, e as rotas), auth, notification e por último a infraestrutura, com as proteções desligadas.
# O processor e o web (site e rota $default) saem primeiro, em paralelo.
# Os nomes dos jobs são numerados pela ordem; no gráfico, os chamados aparecem como "<etapa> / Remover".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy-prod" para confirmar'
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ambiente-prod
  cancel-in-progress: false

jobs:
  confirmar:
    name: 0 · Confirmar
    runs-on: ubuntu-latest
    steps:
      - name: Recusar se a confirmação não for destroy-prod
        if: inputs.confirm != 'destroy-prod'
        run: |
          echo "::error::Confirmação inválida: digite destroy-prod."
          exit 1

  # O worker sai antes do video-api, que apaga o namespace fiapx inteiro.
  observabilidade:
    name: 1 · Observabilidade (New Relic)
    needs: confirmar
    # Primeiro: alertas e monitor somem antes dos serviços, sem alarme falso durante a derrubada (ADR-021).
    uses: ./.github/workflows/newrelic.yml
    with: { acao: destroy }
    secrets: inherit

  processor:
    name: 1 · Processor (EKS + KEDA)
    needs: confirmar
    uses: hackathon-fiap-soat/fiapx-video-processor/.github/workflows/destroy.yml@main
    secrets: inherit

  # O site sai antes do video-api, que apaga o namespace fiapx inteiro.
  web:
    name: 1 · Site (nginx no EKS e rota $default)
    needs: confirmar
    uses: hackathon-fiap-soat/fiapx-web/.github/workflows/destroy.yml@main
    secrets: inherit

  video-api:
    name: 2 · Video API (EKS e rotas)
    needs: [confirmar, processor, web]
    if: always() && needs.confirmar.result == 'success'
    uses: hackathon-fiap-soat/fiapx-video-api/.github/workflows/destroy.yml@main
    secrets: inherit

  auth:
    name: 3 · Auth (Lambdas e rotas)
    needs: [confirmar, video-api]
    if: always() && needs.confirmar.result == 'success'
    uses: hackathon-fiap-soat/fiapx-auth/.github/workflows/destroy.yml@main
    secrets: inherit

  notification:
    name: 4 · Notificação (Lambda, fila e tabela)
    needs: [confirmar, auth]
    if: always() && needs.confirmar.result == 'success'
    uses: hackathon-fiap-soat/fiapx-notification/.github/workflows/destroy.yml@main
    secrets: inherit

  infra:
    name: 5 · Infraestrutura (Terraform destroy)
    needs: [confirmar, observabilidade, processor, web, video-api, auth, notification]
    if: >-
      always() && needs.confirmar.result == 'success' && needs.observabilidade.result == 'success' &&
      needs.processor.result == 'success' && needs.web.result == 'success' &&
      needs.video-api.result == 'success' && needs.auth.result == 'success' && needs.notification.result == 'success'
    uses: ./.github/workflows/terraform.yml
    with: { acao: destroy }
    secrets: inherit
